name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked workspace
        run: npm ci
      - name: Install pinned TypeScript compiler
        run: npm install --no-save --ignore-scripts typescript@5.8.3
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests and package build
        run: npm test
      - name: Repository security scan
        run: npm run security:scan
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
